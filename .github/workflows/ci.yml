name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Laravel/PHP support windows: 10 → 8.1-8.3, 11 → 8.2-8.4, 12 → 8.2-8.5, 13 → 8.3-8.5.
        include:
          - { laravel: '10.*', testbench: '8.*', php: '8.1' }
          - { laravel: '10.*', testbench: '8.*', php: '8.2' }
          - { laravel: '10.*', testbench: '8.*', php: '8.3' }
          - { laravel: '11.*', testbench: '9.*', php: '8.2' }
          - { laravel: '11.*', testbench: '9.*', php: '8.3' }
          - { laravel: '11.*', testbench: '9.*', php: '8.4' }
          - { laravel: '12.*', testbench: '10.*', php: '8.2' }
          - { laravel: '12.*', testbench: '10.*', php: '8.3' }
          - { laravel: '12.*', testbench: '10.*', php: '8.4' }
          - { laravel: '12.*', testbench: '10.*', php: '8.5' }
          - { laravel: '13.*', testbench: '11.*', php: '8.3' }
          - { laravel: '13.*', testbench: '11.*', php: '8.4' }
          - { laravel: '13.*', testbench: '11.*', php: '8.5' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer validate --strict
      - name: Pin Laravel ${{ matrix.laravel }}
        run: |
          composer require --no-interaction --no-update "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}"
          composer require --no-interaction --no-update --dev "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies
      - run: vendor/bin/phpunit

  quality:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer validate --strict
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer lint
      - run: composer analyse

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
